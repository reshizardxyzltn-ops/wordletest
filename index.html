<style>
/* Layout: one-screen game column — header, board, keyboard — stacked and centered */
:root {
  --bg: #FFFFFF;
  --surface: #FFFFFF;
  --ink: #1F1415;
  --muted: #6F5F60;
  --line: #DED3D3;
  --line-strong: #8C7C7D;
  --key: #E9E0E0;
  --key-ink: #1F1415;
  --red: #C8102E;
  --red-deep: #8E0B20;
  --gold: #C9962A;
  --absent: #7A6B6C;
  --on-tile: #FFFFFF;
  --scrim: rgba(31, 20, 21, .45);
  --shadow: 0 18px 50px rgba(60, 10, 18, .18);
  --font: "Poppins", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}

body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  -webkit-font-smoothing: antialiased;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}
.app {
  display: flex;
  flex-direction: column;
  max-width: 520px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 12px;
}

/* Header */
header {
  display: flex;
  justify-content: center;
  padding-block: 16px 14px;
  position: relative;
}
.endpanel {
  height: 184px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
  text-align: center;
}
.endpanel p { margin: 0; font-size: 1rem; color: var(--muted); }
.endpanel p strong { color: var(--ink); font-weight: 700; letter-spacing: .14em; }
.endpanel .primary { max-width: 260px; }
@media (max-height: 640px) { .endpanel { height: 160px; } }
header::after {
  /* tartan stripe */
  content: "";
  position: absolute;
  left: 0; right: 0; bottom: 0;
  height: 4px;
  border-radius: 4px;
  background:
    repeating-linear-gradient(90deg, transparent 0 10px, color-mix(in srgb, var(--ink) 35%, transparent) 10px 12px, transparent 12px 22px),
    repeating-linear-gradient(90deg, var(--red) 0 14px, var(--red-deep) 14px 22px);
}
.brand { text-align: center; line-height: 1.05; }
.brand h1 {
  margin: 0;
  font-size: 1.75rem;
  font-weight: 800;
  letter-spacing: -.02em;
}
.brand h1 span { color: var(--red); }
.brand small {
  display: block;
  font-size: .62rem;
  font-weight: 600;
  letter-spacing: .22em;
  text-transform: uppercase;
  color: var(--muted);
  margin-top: 3px;
}
.hgroup { display: flex; gap: 4px; }
.hgroup.right { justify-content: flex-end; }
.icon-btn {
  width: 40px; height: 40px;
  display: grid; place-items: center;
  border: 0; border-radius: 10px;
  background: transparent;
  color: var(--ink);
  cursor: pointer;
  transition: background .15s;
}
.icon-btn:hover { background: var(--key); }
.icon-btn svg { width: 22px; height: 22px; }
:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }

/* Board */
main {
  display: grid;
  place-items: center;
  padding-block: 16px;
}
.board {
  --tile: min(62px, calc((100vw - 32px - 24px) / 5));
  display: grid;
  grid-template-rows: repeat(6, var(--tile));
  gap: 6px;
}
.row { display: grid; grid-template-columns: repeat(5, var(--tile)); gap: 6px; }
.tile {
  display: grid; place-items: center;
  border: 2px solid var(--line);
  border-radius: 6px;
  background: var(--surface);
  font-size: calc(var(--tile) * .52);
  font-weight: 700;
  text-transform: uppercase;
  user-select: none;
}
.tile[data-letter] { border-color: var(--line-strong); animation: pop .1s ease-out; }
.tile[data-state] { color: var(--on-tile); border-color: transparent; }
.tile[data-state="correct"] { background: var(--red); }
.tile[data-state="present"] { background: var(--gold); }
.tile[data-state="absent"] { background: var(--absent); }
.tile.flip { animation: flip .5s ease-in-out both; }
.tile.bounce { animation: bounce .9s ease both; }
.row.shake { animation: shake .45s; }

@keyframes pop { 50% { transform: scale(1.08); } }
@keyframes flip { 0% { transform: rotateX(0); } 50% { transform: rotateX(-90deg); } 100% { transform: rotateX(0); } }
@keyframes shake {
  10%, 90% { transform: translateX(-2px); } 20%, 80% { transform: translateX(4px); }
  30%, 50%, 70% { transform: translateX(-6px); } 40%, 60% { transform: translateX(6px); }
}
@keyframes bounce {
  0%, 20% { transform: translateY(0); } 40% { transform: translateY(-26px); }
  50% { transform: translateY(4px); } 60% { transform: translateY(-12px); }
  80% { transform: translateY(2px); } 100% { transform: translateY(0); }
}

/* Keyboard */
.keyboard { display: flex; flex-direction: column; gap: 8px; user-select: none; }
.krow { display: flex; gap: 6px; justify-content: center; }
.krow .spacer { flex: .5; }
.key {
  flex: 1;
  height: 56px;
  min-width: 0;
  border: 0; border-radius: 8px;
  background: var(--key);
  color: var(--key-ink);
  font: 600 1rem var(--font);
  text-transform: uppercase;
  cursor: pointer;
  display: grid; place-items: center;
  transition: background .2s, transform .06s;
}
.key:active { transform: scale(.95); }
.key.wide { flex: 1.55; font-size: .72rem; letter-spacing: .04em; }
.key svg { width: 22px; height: 22px; }
.key[data-state] { color: var(--on-tile); }
.key[data-state="correct"] { background: var(--red); }
.key[data-state="present"] { background: var(--gold); }
.key[data-state="absent"] { background: var(--absent); }
@media (hover: hover) { .key:not([data-state]):hover { background: color-mix(in srgb, var(--key) 80%, var(--ink)); } }

/* Toasts */
.toasts {
  position: fixed;
  top: calc(env(safe-area-inset-top, 0px) + 84px);
  left: 0; right: 0;
  display: flex; flex-direction: column; align-items: center; gap: 8px;
  pointer-events: none;
  z-index: 30;
}
.toast {
  background: var(--ink);
  color: var(--bg);
  font-weight: 600;
  font-size: .9rem;
  padding: 10px 16px;
  border-radius: 8px;
  box-shadow: var(--shadow);
  transition: opacity .3s;
}
.toast.out { opacity: 0; }

/* Modals */
.modal {
  position: fixed; inset: 0;
  background: var(--scrim);
  display: grid; place-items: center;
  padding: 16px;
  z-index: 40;
  animation: fade .2s ease;
}
.sheet {
  position: relative;
  width: 100%; max-width: 420px;
  max-height: calc(100% - 16px);
  overflow-y: auto;
  background: var(--surface);
  color: var(--ink);
  border-radius: 16px;
  box-shadow: var(--shadow);
  padding: 28px 24px 24px;
  animation: rise .25s ease;
}
.sheet .close { position: absolute; top: 10px; right: 10px; }
.sheet h2 {
  margin: 0 0 16px;
  font-size: .8rem;
  font-weight: 700;
  letter-spacing: .14em;
  text-transform: uppercase;
}
.sheet p { margin: 0 0 12px; line-height: 1.55; font-size: .92rem; }
.sheet ul { margin: 0 0 16px; padding-left: 20px; font-size: .92rem; line-height: 1.6; }
@keyframes fade { from { opacity: 0; } }
@keyframes rise { from { transform: translateY(16px); opacity: 0; } }

.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; text-align: center; margin-bottom: 22px; }
.stats b { display: block; font-size: 2rem; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stats span { font-size: .7rem; color: var(--muted); line-height: 1.3; display: block; }
.dist { display: grid; gap: 5px; margin-bottom: 22px; }
.dist .bar-row { display: grid; grid-template-columns: 14px 1fr; gap: 8px; align-items: center; font-size: .85rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.dist .bar {
  min-width: 26px;
  padding: 2px 8px;
  border-radius: 4px;
  background: var(--absent);
  color: var(--on-tile);
  text-align: right;
  font-size: .8rem;
  transition: width .5s ease;
}
.dist .bar.hit { background: var(--red); }
.answer-line { text-align: center; font-size: .9rem; color: var(--muted); margin: -6px 0 18px; }
.answer-line strong { color: var(--ink); letter-spacing: .12em; }

.primary {
  width: 100%;
  height: 50px;
  border: 0; border-radius: 999px;
  background: var(--red);
  color: #fff;
  font: 600 1rem var(--font);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  transition: filter .15s, transform .06s;
}
.primary:hover { filter: brightness(1.08); }
.primary:active { transform: scale(.98); }

.example { display: flex; gap: 4px; margin: 4px 0 6px; --tile: 36px; }
.example .tile { width: var(--tile); height: var(--tile); font-size: 1.1rem; border-radius: 5px; }
.example + p { font-size: .85rem; color: var(--muted); }

@media (max-height: 640px) {
  .key { height: 48px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}
</style>

    <p id="endMsg"></p>
    <button class="primary" id="playAgain" type="button">Play again</button>
  </div>
</div>

<div class="toasts" id="toasts" role="status" aria-live="polite"></div>

  }
  for (let i = 0; i < COLS; i++) {
    if (res[i] !== "correct" && counts[guess[i]] > 0) { res[i] = "present"; counts[guess[i]]--; }
  }
  return res;
}

/* ---------- build UI ---------- */
function buildBoard() {
  boardEl.innerHTML = "";
  for (let r = 0; r < ROWS; r++) {
    const row = document.createElement("div");
    row.className = "row";
    for (let c = 0; c < COLS; c++) {
      const t = document.createElement("div");
      t.className = "tile";
      row.appendChild(t);
    }
    boardEl.appendChild(row);
  }
}

const BACKSPACE_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 5H9l-6 7 6 7h12z"/><path d="M17 9l-6 6M11 9l6 6"/></svg>';
function buildKeyboard() {
  const layout = ["qwertyuiop", "_asdfghjkl_", "ezxcvbnmb"];
  kbEl.innerHTML = "";
  layout.forEach(line => {
    const row = document.createElement("div");
    row.className = "krow";
    [...line].forEach((ch, i) => {
      if (ch === "_") { const s = document.createElement("div"); s.className = "spacer"; row.appendChild(s); return; }
      const k = document.createElement("button");
      k.className = "key";
      k.type = "button";
      if (line.startsWith("e") && i === 0) { k.dataset.key = "Enter"; k.textContent = "Enter"; k.classList.add("wide"); }
      else if (line.startsWith("e") && i === line.length - 1) { k.dataset.key = "Backspace"; k.innerHTML = BACKSPACE_SVG; k.classList.add("wide"); k.setAttribute("aria-label", "Delete"); }
      else { k.dataset.key = ch.toUpperCase(); k.textContent = ch; }
      row.appendChild(k);
    });
    kbEl.appendChild(row);
  });
}

function tilesOf(r) { return boardEl.children[r].children; }

function paintKey(letter, st) {
  const k = kbEl.querySelector(`[data-key="${letter}"]`);
  if (!k) return;
  if (!k.dataset.state || RANK[st] > RANK[k.dataset.state]) k.dataset.state = st;
}

function showEnd() {
  const over = state.status !== "playing";
  kbEl.hidden = over;
  $("endpanel").hidden = !over;
  if (over) {
    $("endMsg").innerHTML = state.status === "won"
      ? `Solved in ${state.guesses.length} of ${ROWS}`
      : `The word was <strong>${ANSWER}</strong>`;
  }
}

function renderAll() {
  buildBoard();
  kbEl.querySelectorAll("[data-state]").forEach(k => delete k.dataset.state);
  state.guesses.forEach((g, r) => {
    const res = score(g, ANSWER);
    [...tilesOf(r)].forEach((t, i) => { t.textContent = g[i]; t.dataset.letter = g[i]; t.dataset.state = res[i]; });
    [...g].forEach((ch, i) => paintKey(ch, res[i]));
  });
  current = "";
  showEnd();
}

function renderCurrent() {
  const r = state.guesses.length;
  if (r >= ROWS) return;
  [...tilesOf(r)].forEach((t, i) => {
    const ch = current[i];
    if (ch) { if (t.dataset.letter !== ch) { t.textContent = ch; t.dataset.letter = ch; } }
    else { t.textContent = ""; delete t.dataset.letter; }
  });
}

/* ---------- toasts ---------- */
function toast(msg, ms = 1400) {
  const el = document.createElement("div");
  el.className = "toast";
  el.textContent = msg;
  $("toasts").prepend(el);
  setTimeout(() => { el.classList.add("out"); setTimeout(() => el.remove(), 300); }, ms);
}

/* ---------- input ---------- */
function onKey(key) {
  if (busy || state.status !== "playing") return;
  if (key === "Enter") return submit();
  if (key === "Backspace") { current = current.slice(0, -1); return renderCurrent(); }
  if (/^[A-Z]$/.test(key) && current.length < COLS) { current += key; renderCurrent(); }
}

function shake(msg) {
  const row = boardEl.children[state.guesses.length];
  row.classList.remove("shake"); void row.offsetWidth; row.classList.add("shake");
  row.addEventListener("animationend", () => row.classList.remove("shake"), { once: true });
  toast(msg);
}

function submit() {
  if (current.length < COLS) return shake("Not enough letters");
  if (!VALID.has(current)) return shake("Not in word list");

  const guess = current, r = state.guesses.length;
  const res = score(guess, ANSWER);
  state.guesses.push(guess);
  current = "";
  const won = guess === ANSWER;
  const lost = !won && state.guesses.length === ROWS;
  if (won || lost) state.status = won ? "won" : "lost";
  save();

  busy = true;
  const tiles = [...tilesOf(r)];
  tiles.forEach((t, i) => {
    setTimeout(() => {
      t.classList.add("flip");
      setTimeout(() => { t.dataset.state = res[i]; }, 250);
      t.addEventListener("animationend", () => t.classList.remove("flip"), { once: true });
    }, i * FLIP);
  });
  setTimeout(() => {
    [...guess].forEach((ch, i) => paintKey(ch, res[i]));
    busy = false;
    if (won) {
      tiles.forEach((t, i) => setTimeout(() => {
        t.classList.add("bounce");
        t.addEventListener("animationend", () => t.classList.remove("bounce"), { once: true });
      }, i * 90));
      toast(PRAISE[r], 1800);
      setTimeout(showEnd, 1300);
    } else if (lost) {
      toast(ANSWER, 2000);
      setTimeout(showEnd, 1300);
    }
  }, COLS * FLIP + 250);
}

/* ---------- game lifecycle ---------- */
function save() {}

function newGame() {
  state = { guesses: [], status: "playing" };
  save();
  renderAll();
}

/* ---------- events ---------- */
kbEl.addEventListener("click", e => {
  const k = e.target.closest(".key");
  if (!k) return;
  k.blur();
  onKey(k.dataset.key);
});

document.addEventListener("keydown", e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (document.activeElement && document.activeElement.id === "playAgain") return;
  const key = e.key.length === 1 ? e.key.toUpperCase() : e.key;
  if (key === "Enter" || key === "Backspace" || /^[A-Z]$/.test(key)) {
    e.preventDefault();
    onKey(key);
  }
});

$("playAgain").addEventListener("click", e => { e.currentTarget.blur(); newGame(); });

/* ---------- boot ---------- */
function start(snap) {
  buildKeyboard();
  state = { guesses: [], status: "playing" };
  renderAll();
}

start();
</script>

</body></html>
